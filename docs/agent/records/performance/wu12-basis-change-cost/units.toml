# The units of plan 0030 criterion 15, for tools/compiles cost on the debug
# trees: every source that includes galoot/core.hpp (the umbrella header
# alone, the core sources that include it or format.hpp, the rga3 preset's
# test sources, and the README's three examples, as text), before (at the
# branch point) and after; the two test sources part B changed, before and
# after; and the new sources of the change of basis, after only.
