# The reference counting a term with coefficient +1 or -1 as two
# multiplications; the committed header then differs from what it writes.
[[mutant]]
name = "golden_sign_as_multiplication"
selection = "golden"
file = "test/reference/golden.py"
edits = [
  { anchor = '''        mul += 1
''', replacement = '''        mul += 2
''' },
]
expect = "killed"
killers = ["reference.golden"]

# The committed count of the point transform's multiplications with
# checking off one higher: the program built with checking off must fail.
[[mutant]]
name = "golden_header_unchecked_count"
selection = "counting"
file = "test/reference/golden.hpp"
edits = [
  { anchor = '''    point_transform = {{48, 36, 3, 0, 0}, {68, 52, 6, 4, 0}};''', replacement = '''    point_transform = {{49, 36, 3, 0, 0}, {68, 52, 6, 4, 0}};''' },
]
expect = "killed"
killers = ["rga3.op_counts_unchecked"]

# The same with checking on: the program built with checking on must fail.
[[mutant]]
name = "golden_header_checking_count"
selection = "counting"
file = "test/reference/golden.hpp"
edits = [
  { anchor = '''    point_transform = {{48, 36, 3, 0, 0}, {68, 52, 6, 4, 0}};''', replacement = '''    point_transform = {{48, 36, 3, 0, 0}, {69, 52, 6, 4, 0}};''' },
]
expect = "killed"
killers = ["rga3.op_counts_checking"]
