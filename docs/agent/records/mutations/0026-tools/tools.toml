# Leak detection removed.
[[mutant]]
name = "mutate_leaks_not_detected"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = "                leaks.append(where)", replacement = "                pass" },
]
expect = "killed"

# Run-time edits not applied to the baseline.
[[mutant]]
name = "mutate_runtime_after_baseline"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = '''
        for file in runtime_files:
            self.write(file, self.base[file])
''', replacement = "" },
  { anchor = "        counts = dict.fromkeys(", replacement = '''
        for file in runtime_files:
            self.write(file, self.base[file])
        counts = dict.fromkeys(''' },
]
expect = "killed"

# The file not restored after a mutant whose build failed.
[[mutant]]
name = "mutate_restore_skipped_after_failed_build"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = "            _, output = self.build(tree, name, selection[\"targets\"])", replacement = "            status, output = self.build(tree, name, selection[\"targets\"])" },
  { anchor = '''
        finally:
            self.write(mutant["file"], self.base[mutant["file"]])''', replacement = '''
        finally:
            if status == 0:
                self.write(mutant["file"], self.base[mutant["file"]])''' },
]
expect = "killed"

# No rebuild when a run stops early.
[[mutant]]
name = "mutate_no_rebuild_after_early_stop"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = '''
            if preset not in session.rebuilt:
                session.rebuild(preset)''', replacement = "            pass" },
]
expect = "killed"

# The killers in the order CTest and Ninja report them.
[[mutant]]
name = "mutate_killers_in_report_order"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = '''
        killers = sorted(set(failed)) + sorted(
            {where for _, kind, _, where in failures
             if kind in ("assert", "test")})''', replacement = '''
        killers = list(dict.fromkeys(failed + [
            where for _, kind, _, where in failures
             if kind in ("assert", "test")]))''' },
]
expect = "killed"

