# The mutants of tools/mutate and tools/compiles, judged by their own
# CTests, which copy the mutated tool into a scratch repository, so each
# mutant is judged by a fresh process. The selections build nothing.
presets = ["gcc-debug"]

[selection.mutate]
targets = []
labels = '^tools\.mutate$'

[selection.compiles]
targets = []
labels = '^tools\.compiles$'

# The anchor count check removed.
[[mutant]]
name = "mutate_count_check_removed"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = "        if found != count:", replacement = "        if False:" },
]
expect = "killed"

# The no-change check removed.
[[mutant]]
name = "mutate_no_change_check_removed"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = "        if texts[mutant[\"name\"]] == text:", replacement = "        if False:" },
]
expect = "killed"

# The dirty-file check removed.
[[mutant]]
name = "mutate_dirty_check_removed"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = '''
    check_clean(session.files)
''', replacement = "" },
]
expect = "killed"

# The empty-selection check removed.
[[mutant]]
name = "mutate_empty_selection_check_removed"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = '''
        if not tests:
''', replacement = '''
        if False:
''' },
]
expect = "killed"

# The unbuilt-program check removed.
[[mutant]]
name = "mutate_unbuilt_program_check_removed"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = "            for program in programs[test[\"name\"]] - built:", replacement = "            for program in ():" },
]
expect = "killed"

# The baseline's failure ignored.
[[mutant]]
name = "mutate_baseline_skipped"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = '''
            if status:
                raise Refused(f"build/{preset}: the baseline''', replacement = '''
            if False:
                raise Refused(f"build/{preset}: the baseline''' },
]
expect = "killed"

# Programs not deleted before a build.
[[mutant]]
name = "mutate_programs_kept"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = "                (tree.path / program).unlink(missing_ok=True)", replacement = "                pass" },
]
expect = "killed"

# Tests of unbuilt programs passed to CTest.
[[mutant]]
name = "mutate_unbuilt_tests_run"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = "            ran = sorted(set(programs) - set(not_run))", replacement = "            ran = sorted(programs)" },
]
expect = "killed"

# Warning counted as a kill.
[[mutant]]
name = "mutate_warning_kills"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = "             if kind in (\"assert\", \"test\")})", replacement = "             if kind in (\"assert\", \"test\", \"warning\")})" },
]
expect = "killed"

# Invalid counted as a kill.
[[mutant]]
name = "mutate_invalid_kills"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = "             if kind in (\"assert\", \"test\")})", replacement = "             if kind in (\"assert\", \"test\", \"invalid\")})" },
]
expect = "killed"

# Test-class errors not counted.
[[mutant]]
name = "mutate_test_class_ignored"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = "             if kind in (\"assert\", \"test\")})", replacement = "             if kind in (\"assert\",)})" },
]
