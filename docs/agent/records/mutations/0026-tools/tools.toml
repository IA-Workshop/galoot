# Equivalent declarations ignored.
[[mutant]]
name = "mutate_equivalent_ignored"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = '''
            verdict = ("equivalent" if mutant["expect"] == "equivalent"
                       else "survived")''', replacement = "            verdict = \"survived\"" },
]
expect = "killed"

# A guard that stops constant evaluation not counted as a kill.
[[mutant]]
name = "mutate_guard_not_a_kill"
selection = "mutate"
file = "tools/mutate"
edits = [
  { anchor = "    r\"static assertion|static_assert|call to non-.?constexpr.? function\")", replacement = "    r\"static assertion|static_assert\")" },
]
