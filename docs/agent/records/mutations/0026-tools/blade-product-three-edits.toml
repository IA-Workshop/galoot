# The blade_product mutants with mutate.py's three run-time edits only,
# which leave the static_assert of the top-generator test case on: under
# --runtime tools/mutate must report it as a leak.
presets = ["gcc-debug", "clang-debug"]

[selection.blade_product]
targets = ["core_blade_product_test", "core_blade_product_assert_fail"]
labels = '^core\.blade_product$'

[[runtime]]
file = "test/core/blade_product_test.cpp"
anchor = 'static_assert(table_mismatches(core::conformal<3>(),'
replacement = 'static_assert(true || table_mismatches(core::conformal<3>(),'
count = 1

[[runtime]]
file = "test/core/blade_product_test.cpp"
anchor = 'static_assert(added('
replacement = 'static_assert(true || added('
count = 3

[[runtime]]
file = "test/core/blade_product_test.cpp"
anchor = 'static_assert(core::detail::blade_product<1>(widest, top, top)'
replacement = 'static_assert(true || core::detail::blade_product<1>(widest, top, top)'
count = 1

[[mutant]]
name = "wedge_sign_side"
selection = "blade_product"
file = "include/galoot/core/blade_product.hpp"
edits = [{ anchor = 'multiply_checked(reorder_sign(generator, blade), c)', replacement = 'multiply_checked(reorder_sign(blade, generator), c)' }]
expect = "killed"

[[mutant]]
name = "wedge_sign_dropped"
selection = "blade_product"
file = "include/galoot/core/blade_product.hpp"
edits = [{ anchor = 'multiply_checked(reorder_sign(generator, blade), c)', replacement = 'c' }]
expect = "killed"

