[[mutant]]
name = "correction_dropped"
selection = "blade_product"
file = "include/galoot/core/blade_product.hpp"
edits = [
  { anchor = '''
      add_blade_product(out, g, rest & ~(mask_t{1} << j), b,
''', replacement = '''
