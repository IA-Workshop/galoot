[[mutant]]
name = "non_floating_catch_all_unconstrained"
selection = "motions"
file = "include/galoot/presets/rga3/motions.hpp"
edits = [
  { anchor = '''
template <class T, class S>
  requires(!std::floating_point<T>)
''', replacement = '''
template <class T, class S>
''' },
]
expect = "equivalent"
reason = "the catch-all becomes viable only for calls that another overload already takes, and that overload still wins by partial ordering or by being more constrained, so no call resolves differently"

