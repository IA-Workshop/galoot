name = "rotation_sin_cos_swapped"
selection = "motions"
file = "include/galoot/presets/rga3/motions.hpp"
edits = [
  { anchor = '''
const T s = std::sin(half) / length;
  const T c = std::cos(half);''', replacement = '''
const T s = std::cos(half) / length;
  const T c = std::sin(half);''' },
]
expect = "killed"

