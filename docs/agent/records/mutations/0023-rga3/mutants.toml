# The mutants of the rga3 preset's headers, ported from mutate.py: the
# same edits, written out (a removed catch-all is its whole declaration
# replaced by nothing).
presets = ["gcc-debug", "clang-debug"]

[selection.motions]
targets = ["rga3_motions_test", "rga3_rotation_mode_0", "rga3_rotation_mode_1"]
labels = '^rga3\.motions$'

[selection.objects]
targets = ["rga3_objects_test", "rga3_motions_test", "rga3_point_groups_test", "rga3_chains_test", "rga3_incidence_test", "rga3_format_test", "rga3_rotation_mode_0", "rga3_rotation_mode_1", "rga3_readme_example_1", "rga3_readme_example_2", "rga3_readme_example_3"]
labels = '^rga3'

[[mutant]]
name = "rotation_full_angle"
selection = "motions"
file = "include/galoot/presets/rga3/motions.hpp"
edits = [{ anchor = 'const T half = theta / T{2};', replacement = 'const T half = theta;' }]
expect = "killed"

[[mutant]]
name = "rotation_negative_angle"
selection = "motions"
file = "include/galoot/presets/rga3/motions.hpp"
edits = [{ anchor = 'const T half = theta / T{2};', replacement = 'const T half = -theta / T{2};' }]
expect = "killed"

