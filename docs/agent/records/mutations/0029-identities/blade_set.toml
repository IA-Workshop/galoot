# The mutants of blade_set.hpp, ported from ../0008-blade-set/mutate.py with
# their names, anchors, and replacements unchanged except for the four
# re-anchored below, whose old text the header no longer has. Judged by the
# blade-set suite: blade_set_test.cpp, the abort test
# core.blade_set_name_assert, and the compile-fail tests
# core.blade_set_<case>. The old driver counted any failed build as a kill;
# here a build stopped only by a warning made an error leaves its mutant
# unjudged. No --runtime edits: the static_asserts of blade_set_test.cpp
# state type properties (the stored layout, trivially copyable, aggregate,
# the size of the widest grades), which no run-time check can replace.
presets = ["gcc-debug", "clang-debug"]

[selection.blade_set]
targets = ["core_blade_set_test", "core_blade_set_name_assert"]
labels = '^core\.blade_set$'

[[mutant]]
name = "parse_sign"
selection = "blade_set"
file = "include/galoot/core/blade_set.hpp"
edits = [{ anchor = "blade.sign *= reorder_sign(blade.mask, generator);", replacement = "blade.sign *= reorder_sign(generator, blade.mask);" }]
expect = "killed"

[[mutant]]
name = "parse_sign_trivectors"
selection = "blade_set"
file = "include/galoot/core/blade_set.hpp"
edits = [{ anchor = "blade.sign *= reorder_sign(blade.mask, generator);", replacement = "blade.sign *= grade(blade.mask) < 2 ? reorder_sign(blade.mask, generator) : 1;" }]
expect = "killed"

[[mutant]]
name = "canonical_tie"
selection = "blade_set"
file = "include/galoot/core/blade_set.hpp"
edits = [{ anchor = "return ((a >> first_difference) & 1U) == 1U;", replacement = "return ((a >> first_difference) & 1U) == 0U;" }]
expect = "killed"

[[mutant]]
name = "full_grade_order"
selection = "blade_set"
file = "include/galoot/core/blade_set.hpp"
edits = [{ anchor = "      append_grade(set.blades, at, N, k);\n    }\n    return set;", replacement = "      append_grade(set.blades, at, N, N - k);\n    }\n    return set;" }]
expect = "killed"

[[mutant]]
name = "binomial"
selection = "blade_set"
file = "include/galoot/core/blade_set.hpp"
edits = [{ anchor = "count = count * (n - i) / (i + 1);", replacement = "count = count * (n - i) / (i + 2);" }]
expect = "killed"

# Added beside binomial, whose smaller count makes append_grade write past
# the end of the set: GCC stops that on the standard library's bounds
# assertion and Clang on the constant evaluation in the header, before any
# test runs. A count one too large for k = 1 leaves the set's size wrong
# instead, which the test's static_assert on of_grade's size can judge.
[[mutant]]
name = "binomial_larger"
selection = "blade_set"
file = "include/galoot/core/blade_set.hpp"
edits = [{ anchor = "count = count * (n - i) / (i + 1);", replacement = "count = count * (n - i + 1) / (i + 1);" }]
expect = "killed"

