[[mutant]]
name = "zero_assert"
selection = "blade_set"
file = "include/galoot/core/blade_set.hpp"
edits = [{ anchor = "static_assert(N >= 1, \"blade_set:", replacement = "static_assert(N >= 0, \"blade_set:" }]
expect = "killed"

# Equivalent since blades<Alg, "..."> takes an algebra tag and rejects a
# metric of no generators by its own message: the guard is now reached only
# from full<N> and of_grade<N, K>, whose bodies are well formed at n = 0, so
# with or without the clause the static_assert N >= 1 gives the one error.
[[mutant]]
name = "zero_guard"
selection = "blade_set"
file = "include/galoot/core/blade_set.hpp"
edits = [{ anchor = "return N >= 1 && N <= mask_bits;", replacement = "return N <= mask_bits;" }]
expect = "equivalent"
reason = "at n = 0 the guarded bodies are well formed, and the static_assert N >= 1 gives the same single error"

