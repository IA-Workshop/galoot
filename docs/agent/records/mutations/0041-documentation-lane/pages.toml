# The mutants of plan 0041's pages part: a page left unregistered, a wrong
# printed value, a changed rejection literal, and a broken CMake block. Each
# edits a file that CMake reads at configure time, so each selection names
# targets: building them makes Ninja re-run CMake, which extracts the
# mutated page or reads the mutated registration before the tests run.
# Every test here is new, so each mutant counts when the test written for it
# is among its killers.
presets = ["gcc-debug", "clang-debug"]

# Every program of the rga3 pages (the README, the first page, the rga3
# guide), since the label rga3.docs selects all their tests, the rejected
# and CMake tests among them, which run the compiler and CMake themselves.
[selection.rga3_docs]
targets = ["rga3_readme_example_1", "rga3_readme_example_2", "rga3_readme_example_3", "rga3_start_example_1", "rga3_start_example_2", "rga3_start_example_3", "rga3_start_example_4", "rga3_start_example_5", "rga3_start_example_6", "rga3_start_example_7", "rga3_start_example_8", "rga3_start_example_9", "rga3_rga3_guide_example_1", "rga3_rga3_guide_example_2", "rga3_rga3_guide_example_3", "rga3_rga3_guide_example_4", "rga3_rga3_guide_example_5", "rga3_rga3_guide_example_6"]
labels = '^rga3\.docs$'

# tests.docs_pages reads the registration at configure time and the tree
# when it runs; one target is enough to make Ninja reconfigure.
[selection.pages]
targets = ["rga3_start_example_1"]
labels = '^tests\.docs$'

# The rga3 guide's registration removed: the page is still under docs/, so
# the pages check must name it.
[[mutant]]
name = "page_unregistered"
selection = "pages"
file = "test/documentation.cmake"
edits = [{ anchor = '''galoot_add_doc_examples(PAGE docs/guide/rga3.md MODULE rga3 NAME rga3_guide
  LINK galoot::presets::rga3)
''', replacement = '' }]
expect = "killed"
killers = ["tests.docs_pages"]

# The first page's second program prints (1.540, 0.841, 2.000); its comment
# claims another third coordinate.
[[mutant]]
name = "prints_wrong"
selection = "rga3_docs"
file = "docs/guide/README.md"
edits = [{ anchor = '''  // prints: (1.540, 0.841, 2.000)''', replacement = '''  // prints: (1.540, 0.841, 2.001)''' }]
expect = "killed"
killers = ["rga3.start_example_2"]

# One word of the first rejected block's literal changed, so that the
# library's message no longer holds it.
[[mutant]]
name = "rejected_message_changed"
selection = "rga3_docs"
file = "docs/guide/README.md"
edits = [{ anchor = '''the second of the two types shown''', replacement = '''the first of the two types shown''' }]
expect = "killed"
killers = ["rga3.start_rejected_1"]

# The README's add_subdirectory block links a target that does not exist.
[[mutant]]
name = "cmake_block_broken"
selection = "rga3_docs"
file = "README.md"
edits = [{ anchor = '''add_subdirectory(galoot)

add_executable(my_program main.cpp)
target_link_libraries(my_program PRIVATE galoot::presets::rga3)''', replacement = '''add_subdirectory(galoot)

add_executable(my_program main.cpp)
target_link_libraries(my_program PRIVATE galoot::presets::rga4)''' }]
expect = "killed"
killers = ["rga3.readme_cmake_1"]
