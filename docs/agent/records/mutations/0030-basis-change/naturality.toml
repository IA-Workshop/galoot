# Edits of the tests' own expected rules for what a change of basis
# preserves and what it does not: each factor of the agreement checks set
# to 1, d replaced by 1/d where they differ, and each expected inequality of
# the basis-dependent operations made an equality. The library is correct,
# so a test that holds its rule as load-bearing fails each wrong rule: a
# kill shows the factor or the inequality is checked, not assumed.
presets = ["gcc-debug", "clang-debug"]

# The agreement checks run in the kernel groups; the inequalities in
# core.basis_change. The label core.basis_change also selects the identity
# program, which carries it, so both programs are built.
[selection.agreement]
targets = ["core_basis_change_identities_test"]
labels = '^core\.basis_change_identities$'

[selection.dependence]
targets = ["core_basis_change_test", "core_basis_change_identities_test"]
labels = '^core\.basis_change$'

[[mutant]]
name = "antiwedge_factor_one"
selection = "agreement"
file = "test/core/basis_change_checks.hpp"
edits = [{ anchor = '''                            inverse_d,
                            core::antiwedge(a_image, b_image)) == "");''', replacement = '''                            rational{1},
                            core::antiwedge(a_image, b_image)) == "");''' }]
expect = "killed"

[[mutant]]
name = "antiwedge_factor_d"
selection = "agreement"
file = "test/core/basis_change_checks.hpp"
edits = [{ anchor = '''                            inverse_d,
