# The attribute-removal mutants of plan 0040 section 8, run a third time
# after the delta review's D1 on gcc-debug: one per attribute of
# GALOOT_ALWAYS_INLINE, the 24 of the run before and project and
# antiproject, each judged by rga3.kernels_inline and
# rga3.kernels_inline_alone. The 24 keep the verdicts of the run before as
# expectations; the two new ones expect a kill, since both compilers showed
# the call.
presets = ["gcc-debug"]

[selection.inline]
targets = ["rga3_kernels_inline_probe"]
labels = '^rga3\.kernels_inline$'

[[mutant]]
name = "run_map_not_forced"
selection = "inline"
file = "include/galoot/core/mv.hpp"
edits = [{ anchor = '''GALOOT_ALWAYS_INLINE constexpr std::array<T, R>
run_map(const std::array<T, KX>& x, std::index_sequence<K...> /*terms*/) {''', replacement = '''constexpr std::array<T, R>
run_map(const std::array<T, KX>& x, std::index_sequence<K...> /*terms*/) {''' }]
expect = "survived"
reason = "it survived its earlier runs"

