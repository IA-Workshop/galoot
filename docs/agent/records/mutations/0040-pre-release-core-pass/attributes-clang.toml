# Plan 0040 section 8, the attribute mutants on clang-debug: each removes
# the attribute from one function of the chain, at the tip of part A. The
# expected verdicts are the plan's, from E1 and the advisory report's
# experiment; one that differs is a finding, recorded in README.md.
# rga3.kernels_inline compiles its probe with fixed flags, so the tree's
# preset matters only for the compiler; the probe's object library is the
# target, so that a mutant that breaks the build is classified.
presets = ["clang-debug"]

[selection.inline]
targets = ["rga3_kernels_inline_probe"]
labels = '^rga3\.kernels_inline$'

[[mutant]]
name = "apply_not_forced"
selection = "inline"
file = "include/galoot/core/mv.hpp"
edits = [{ anchor = '''GALOOT_ALWAYS_INLINE [[nodiscard]] constexpr mv<Alg, Target, T>
apply(const mv<Alg, A, T>& x, const mv<Alg, B, T>& y) {''', replacement = '''[[nodiscard]] constexpr mv<Alg, Target, T>
apply(const mv<Alg, A, T>& x, const mv<Alg, B, T>& y) {''' }]
expect = "killed"
killers = ["rga3.kernels_inline"]

[[mutant]]
name = "run_product_not_forced"
selection = "inline"
file = "include/galoot/core/mv.hpp"
edits = [{ anchor = '''GALOOT_ALWAYS_INLINE constexpr std::array<T, R>
run_product(''', replacement = '''constexpr std::array<T, R>
run_product(''' }]
expect = "killed"
killers = ["rga3.kernels_inline"]

[[mutant]]
name = "transform_not_forced"
selection = "inline"
file = "include/galoot/core/transform.hpp"
edits = [{ anchor = '''GALOOT_ALWAYS_INLINE [[nodiscard]] constexpr mv<Alg, X, T>
transform(const mv<Alg, X, T>& x, const mv<Alg, V, T>& v) {''', replacement = '''[[nodiscard]] constexpr mv<Alg, X, T>
transform(const mv<Alg, X, T>& x, const mv<Alg, V, T>& v) {''' }]
expect = "killed"
killers = ["rga3.kernels_inline"]

[[mutant]]
name = "run_map_not_forced"
selection = "inline"
file = "include/galoot/core/mv.hpp"
edits = [{ anchor = '''GALOOT_ALWAYS_INLINE constexpr std::array<T, R>
run_map(''', replacement = '''constexpr std::array<T, R>
run_map(''' }]
expect = "survived"
reason = "the compilers inline it at -O2 without the attribute, which then guards against a later inliner; a kill is evidence that it is needed now"

