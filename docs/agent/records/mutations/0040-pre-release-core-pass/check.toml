# Plan 0040 section 8: the mutants of the structure check's script, each
# written for one of the fixture tests. The script reads no compiler, so
# the two presets give one answer; both run, as for every mutant.
presets = ["gcc-debug", "clang-debug"]

[selection.check]
targets = []
labels = '^tools\.kernels_inline$'

# Tail jumps are not read as calls.
[[mutant]]
name = "check_ignores_jmp"
selection = "check"
file = "test/tools/kernels_inline.py"
edits = [{ anchor = '''(call|callq|jmp|jmpq)''', replacement = '''(call|callq)''' }]
expect = "killed"
killers = ["tools.kernels_inline_rejects_jmp"]

# The symbol must end the operand, so a call through the PLT or the global
# offset table is not read as one.
[[mutant]]
name = "check_ignores_plt"
selection = "check"
file = "test/tools/kernels_inline.py"
edits = [{ anchor = '''_ZZ?N[KVrRO]*6galoot")''', replacement = '''_ZZ?N[KVrRO]*6galoot[\w.$]*$")''' }]
expect = "killed"
killers = ["tools.kernels_inline_rejects_plt"]

# A function missing from the output is not reported.
[[mutant]]
name = "check_skips_missing"
selection = "check"
file = "test/tools/kernels_inline.py"
edits = [{ anchor = '''        if not any(label.startswith(prefix) for label in labels):''', replacement = '''        if False:''' }]
expect = "killed"
killers = ["tools.kernels_inline_rejects_missing_function"]
